name: Build & Release Multiplataforma

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-x64
            builder_args: --mac --x64
          - os: ubuntu-latest
            platform: linux
            builder_args: --linux --x64
          - os: windows-latest
            platform: win
            builder_args: --win --x64

    defaults:
      run:
        working-directory: application
        shell: bash

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (requerido por electron-builder)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install

      - name: Compilar TypeScript y Vite
        run: |
          bunx tsc
          bunx vite build

      - name: Empaquetar con electron-builder (${{ matrix.platform }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bunx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Subir instaladores como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ControlTermicoUNTDF-${{ matrix.platform }}
          path: |
            application/release/**/*.dmg
            application/release/**/*.AppImage
            application/release/**/*.exe
          if-no-files-found: error

  release:
    name: Publicar GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Descargar artefactos de las 3 plataformas
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crear Release y adjuntar instaladores
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.exe