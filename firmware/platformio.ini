[platformio]
default_envs = esp32s_hardware

[env]
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    arkhipenko/TaskScheduler
    mobizt/ESP Mail Client


; ENTORNO 1: HARDWARE REAL (NodeMCU-32S)
[env:esp32s_hardware]
platform = espressif32
board = nodemcu-32s
framework = arduino
; Partition Scheme: default.csv (1.2MB APP / 1.5MB SPIFFS) es ideal para tu firmware
board_build.partitions = default.csv
build_flags = 
    ; Nada especial por ahora, ESP32 maneja LwIP de forma nativa.


; ENTORNO 2: SIMULADOR WOKWI
[env:esp32s_wokwi]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
    ; Flag para que el código sepa que está en Wokwi (por las dudas)
    -D ENTORNO_WOKWI
board_build.partitions = default.csv