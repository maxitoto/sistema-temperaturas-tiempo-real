; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ./src

[common]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<tests/> -<esquema/>
board_build.partitions = huge_app.csv
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-section
monitor_filters = esp32_exception_decoder, default


[env:nodemcu-32s-runtime]
extends = common
lib_deps = 
	adafruit/Adafruit GFX Library@1.13.0
	adafruit/Adafruit SSD1306@2.5.17
	paulstoffregen/OneWire@2.3.8
build_src_filter = +<*> -<tests/> -<esquema/> -<database/DB_DDL/>

[env:nodemcu-32s-not-runtime]
extends = common
build_src_filter = -<*> +<database/DB_DDL> +<database/common> +<hardware/driver/tarjetasd> +<hardware/placa>