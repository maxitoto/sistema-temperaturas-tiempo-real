[platformio]
default_envs = esp32s_hardware

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters =
    esp32_exception_decoder
    time
    send_on_enter

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = default.csv

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

; ENTORNO 1: HARDWARE REAL (NodeMCU-32S / ESP-WROOM-32)
[env:esp32s_hardware]
upload_speed = 921600
build_flags =
    -D ENTORNO_HARDWARE
    -DCORE_DEBUG_LEVEL=1
    -O2

; ENTORNO 2: SIMULADOR WOKWI
[env:esp32s_wokwi]
build_flags =
    -D ENTORNO_WOKWI
    -DCORE_DEBUG_LEVEL=1
    -O2