; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	adafruit/Adafruit SSD1306@^2.5.17
build_src_filter = 
	+<*>
	-<../migration/**>
	-<../sdcard/**>
	-<../docs/**>

[env:nodemcu-32s]
extends = common
build_src_filter = -<tests/>

[env:nodemcu-32s-tests]
extends = common
;MacOs
; PLATFORMIO_SRC_DIR="./src/tests/test001" pio run -e nodemcu-32s-tests -t upload -t monitor

;Windows (powershell)
; $env:PLATFORMIO_SRC_DIR=".\src\tests\test001"; pio run -e nodemcu-32s-tests -t upload -t monitor   
