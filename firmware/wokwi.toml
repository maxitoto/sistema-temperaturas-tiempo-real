[wokwi]
version = 1
firmware = '.pio/build/WokwiSimulator/firmware.bin'
elf = '.pio/build/WokWiSimulator/firmware.elf'
private_gateway = true

rfc2217ServerPort = 4000

[net]
gateway = "ws://127.0.0.1:9011"

[[sdcard]]
folder = 'sdcard'      # carpeta local que se copia a la tarjeta al iniciar y donde se vuelca al terminar
writeback = true       # guarda los cambios del firmware en la carpeta local
size = '8M'            # capacidad (por defecto 8M, máximo 256M)

