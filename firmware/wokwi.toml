[wokwi]
version = 1
firmware = '.pio/build/esp32s_wokwi/firmware.bin'
elf = '.pio/build/esp32s_wokwi/firmware.elf'

rfc2217ServerPort = 4000

[[sdcard]]
folder = './sdcard'
size = '32M'
writeable = true

[net]
gateway = "ws://127.0.0.1:9011"

[[net.forward]] #red gateway
from = "127.0.0.1:9080"
to = "target:80" 